[libdefaults]
    default_realm = HADOOP.LOCAL
    dns_lookup_realm = false
    dns_lookup_kdc = false
    # Disable hostname canonicalization - prevents Docker FQDN from replacing short hostname
    canonicalize = false
    ticket_lifetime = 24h
    renew_lifetime = 7d
    forwardable = true
    rdns = false
    no_addresses = true

[realms]
    HADOOP.LOCAL = {
        kdc = kdc:88
        admin_server = kdc:749
    }

[domain_realm]
    .hadoop.local = HADOOP.LOCAL
    hadoop.local = HADOOP.LOCAL
    namenode = HADOOP.LOCAL
    datanode1 = HADOOP.LOCAL
    datanode2 = HADOOP.LOCAL
    kdc = HADOOP.LOCAL
    # Map Docker Compose FQDNs to the realm as well
    .full-distributed-hadoop_hadoop = HADOOP.LOCAL
    full-distributed-hadoop_hadoop = HADOOP.LOCAL
